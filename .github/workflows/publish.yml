name: Publish PyPI Package

on:
  # Disabled in this fork: release events must not publish packages.
  workflow_dispatch:

jobs:
  publish-pypi:
    # Disabled in this fork: manually dispatched runs also cannot publish.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: |
          pipx install poetry
          poetry self add "poetry-dynamic-versioning[plugin]"
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'poetry'
      - name: Install dependencies
        run: poetry install
      - name: Build and publish
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          poetry publish --build -u "__token__" -p $PYPI_TOKEN